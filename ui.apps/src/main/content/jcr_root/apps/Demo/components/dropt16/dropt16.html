<div data-sly-use.template="core/wcm/components/commons/v1/templates.html" />
<div data-sly-call="${template.placeholder @ isEmpty=!properties.name}" />

<!-- Check if Name is provided -->
<div data-sly-test="${properties.textfield}">
    <h3>Name: ${properties.textfield}</h3>

    <!-- Check if an image is selected -->
    <div data-sly-test="${properties.imageDropdown}">
        <h3>Selected Image:</h3>
        <img src="${properties.imageDropdown}" alt="Selected bike Image"  class="dynamic-image" style="width: 350px; height: 350px;" />
    </div>
</div>
